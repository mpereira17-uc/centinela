name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # numpy: lo usa el detector de voz clonada; sus pruebas lo necesitan aunque el backend arranque sin él
      - run: pip install -r requirements.txt pip-audit numpy==2.5.3
      - name: Pruebas
        working-directory: backend
        run: pytest -q
      - name: Dependencias con vulnerabilidades conocidas
        run: pip-audit -r requirements.txt
